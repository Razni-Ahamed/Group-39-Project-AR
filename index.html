<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday Apsara – AR Card</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script>
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;
          this.el.setAttribute('color', colors[index]);
        });
      }
    });
    // Tapping this object shows or hides another entity (the target).
    AFRAME.registerComponent('surprise-toggle', {
      schema: { target: { type: 'selector' } },
      init: function () {
        this.el.addEventListener('click', () => {
          const target = this.data.target;
          target.setAttribute('visible', !target.getAttribute('visible'));
        });
      }
    });
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = '🎉 Card found! Tap the balloon or the gift';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Card lost – point the camera at the Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }
    #status { position: fixed; top: 0; left: 0; right: 0; z-index: 999; padding: 10px;
      text-align: center; color: white; font-family: sans-serif; background: #C62828; }
  </style>
</head>
<body>
  <div id="status">Looking for the birthday card...</div>
  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets timeout="20000">
      <a-asset-item id="present-model" src="models/present.glb"></a-asset-item>
    </a-assets>
    <a-marker preset="hiro" marker-status>
      <!-- Floor -->
      <a-plane rotation="-90 0 0" width="1.6" height="1.6" color="#4A148C"></a-plane>

      <!-- 3D model: "Present" by CreativeTrio (CC0 1.0), standing behind the cake on the balloon side -->
      <a-entity gltf-model="#present-model" position="0.45 0 -0.5" scale="1.8 1.8 1.8"
        animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true"></a-entity>

      <!-- Cake: two stacked layers. Bottom spans y 0 to 0.25, top spans y 0.25 to 0.45 -->
      <a-cylinder position="0 0.125 0" radius="0.35" height="0.25" color="#F48FB1"></a-cylinder>
      <a-cylinder position="0 0.35 0" radius="0.23" height="0.2" color="#FFF3E0"></a-cylinder>

      <!-- Candles stand on the top layer (y 0.45 to 0.59), each with a flame above it -->
      <a-cylinder position="-0.1 0.52 0" radius="0.02" height="0.14" color="#4CC3D9"></a-cylinder>
      <a-cone position="-0.1 0.625 0" radius-bottom="0.03" radius-top="0" height="0.07" color="#FF9800"
        animation="property: scale; from: 1 1 1; to: 1.2 1.3 1.2; dir: alternate; dur: 400; easing: easeInOutSine; loop: true"></a-cone>
      <a-cylinder position="0 0.52 0" radius="0.02" height="0.14" color="#7BC8A4"></a-cylinder>
      <a-cone position="0 0.625 0" radius-bottom="0.03" radius-top="0" height="0.07" color="#FFC107"
        animation="property: scale; from: 1 1 1; to: 1.2 1.3 1.2; dir: alternate; dur: 350; easing: easeInOutSine; loop: true"></a-cone>
      <a-cylinder position="0.1 0.52 0" radius="0.02" height="0.14" color="#9B59B6"></a-cylinder>
      <a-cone position="0.1 0.625 0" radius-bottom="0.03" radius-top="0" height="0.07" color="#FF9800"
        animation="property: scale; from: 1 1 1; to: 1.2 1.3 1.2; dir: alternate; dur: 450; easing: easeInOutSine; loop: true"></a-cone>

      <!-- Balloon, with its string as a child so the two always move together -->
      <a-sphere id="balloon" class="clickable" color-changer position="0.6 0.75 0" radius="0.16" color="#EF2D5E"
        animation="property: position; from: 0.6 0.75 0; to: 0.6 0.95 0; dir: alternate; dur: 900; easing: easeInOutQuad; loop: true">
        <a-cylinder position="0 -0.36 0" radius="0.006" height="0.4" color="#ECEFF1"></a-cylinder>
      </a-sphere>

      <!-- Gift: a box with a contrasting ribbon wrapped over it -->
      <a-box id="gift" class="clickable" surprise-toggle="target: #surprise" position="-0.6 0.15 0" width="0.3" height="0.3" depth="0.3" color="#1976D2"></a-box>
      <a-box position="-0.6 0.155 0" width="0.06" height="0.31" depth="0.31" color="#FFEB3B"></a-box>

      <!-- Hidden surprise above the gift, shown when the gift is tapped (the default font has no emoji) -->
      <a-text id="surprise" visible="false" value="Make a wish! Have an amazing year!" position="-0.5 0.85 0"
        align="center" width="1.2" wrap-count="20" color="#311B92"
        geometry="primitive: plane; width: 1.2; height: 0.26" material="color: #FFEB3B"></a-text>

      <!-- Label, on a dark backing so it stays readable over any camera background -->
      <a-text value="Happy Birthday Apsara!" position="0 1.3 0" align="center" width="3" color="#FFFFFF"
        geometry="primitive: plane; width: 1.8; height: 0.22" material="color: #311B92"></a-text>
    </a-marker>
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
